
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Мої завдання</h1>

    <!-- Створення групи -->
    <div class="group-create">
        <input
            type="text"
            id="groupInput"
            placeholder="Назва нової групи..."
        >
        <button id="addGroupButton">+ Група</button>
    </div>

    <!-- Додавання завдання -->
    <div class="task-create">

        <input
            type="text"
            id="taskInput"
            placeholder="Нове завдання..."
        >

        <select id="groupSelect">
        </select>

        <input
            type="date"
            id="dateInput"
        >

        <button id="addButton">Додати</button>

    </div>

    <!-- Список груп -->
    <div id="groupsContainer"></div>

</div>

<script src="script.js"></script>

</body>
</html>
